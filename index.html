<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Michelle Haggis">
  <meta name="description" content="Frontend Mentor - QR Code Components">
  
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | QR code component</title>
</head>
<body>
  <main>
    <div class="container">
      <div class="image">
        <img src="./images/image-qr-code.png" alt="qr image">
      </div>
      <div class="content">
        <h3 class="heading"> Improve your front-end skills by building project</h3>
        <p class="text">Scan the QR code to visit Frotend Mentor and take your coding skills to the next level</p>
      </div>
    </div>

  </main>
  <footer>
      <div class="attribution">
        Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
        <br> 
        Coded by <a href="#">Michelle Haggis</a>.
      </div>
  </footer>

</html>
